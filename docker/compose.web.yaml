# Frontend overlay for backend/TkpApi/Deployment/deploy-v1/compose.yaml.
# Run from the repository root with a private tenant env file derived from the
# backend examples and extended with WEB_IMAGE and a unique WEB_PORT:
#   docker compose --env-file <tenant-a.env> -f backend/TkpApi/Deployment/deploy-v1/compose.yaml -f docker/compose.web.yaml config
#   docker compose --env-file <tenant-a.env> -f backend/TkpApi/Deployment/deploy-v1/compose.yaml -f docker/compose.web.yaml up -d --wait
# Repeat with tenant-b.env. Route TENANT_HOST to 127.0.0.1:WEB_PORT in the host
# reverse proxy. Compose project names keep the two ingress networks separate.
services:
  web:
    image: ${WEB_IMAGE:?Set web image tag or digest}
    build:
      # Compose resolves this relative to the first (backend) compose file.
      context: ../../../..
      dockerfile: Dockerfile.web
    cpus: ${WEB_CPUS:-0.5}
    mem_limit: ${WEB_MEMORY_LIMIT:-128m}
    pids_limit: ${WEB_PIDS_LIMIT:-128}
    ports:
      - '127.0.0.1:${WEB_PORT:?Set unique loopback web port}:8080'
    networks: [ingress]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:8080/healthz >/dev/null || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}

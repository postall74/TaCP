# ============================================================
# TKP·PRO — непрерывная интеграция.
#   • frontend: установка → typecheck → Vitest → production-сборка;
#   • backend:  xUnit-тесты → сборка API в Release.
# Запускается на каждый push в main и на каждый Pull Request.
# ============================================================

name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend — тесты + сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Модульные тесты (Vitest)
        run: npm test

      - name: Production-сборка
        run: npm run build

  backend:
    name: Backend — тесты + сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Модульные тесты (xUnit)
        run: dotnet test backend/TkpApi.Tests --verbosity normal

      - name: Сборка API (Release)
        run: dotnet build backend/TkpApi/TkpApi.csproj --configuration Release --no-restore
